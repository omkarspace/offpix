name: Quantize GFPGAN v1.4 (Sub-175 MB LiteRT)

on:
  workflow_dispatch:

jobs:
  quantize-gfpgan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ai-edge-quantizer and ai-edge-litert
        run: |
          pip install --upgrade pip
          pip install ai-edge-quantizer ai-edge-litert

      - name: Download GPU-clean GFPGAN v1.4 FP16 from litert-community (Apache 2.0)
        run: |
          curl -fSL https://huggingface.co/litert-community/GFPGAN-v1.4-LiteRT/resolve/main/gfpgan_fp16.tflite -o gfpgan_fp16.tflite
          ls -lh gfpgan_fp16.tflite

      - name: Quantize GFPGAN v1.4 to INT8 weights
        run: |
          python scripts/quantize_gfpgan.py --input gfpgan_fp16.tflite
          python scripts/inspect_models.py

      - name: Upload quantized gfpgan_v14_opt.tflite artifact
        uses: actions/upload-artifact@v4
        with:
          name: gfpgan-v14-int8-litert
          path: pack_models/src/main/assets/models/gfpgan_v14_opt.tflite
          retention-days: 14
